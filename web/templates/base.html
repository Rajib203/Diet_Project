<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <title>
        {% block title %}
        Diet & Nutrition Recommendation System
        {% endblock %}
    </title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    <!-- Page CSS -->
    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Page Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    {% include 'footer.html' %}

</body>

</html>
