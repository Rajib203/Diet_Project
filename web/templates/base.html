{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diet & Nutrition System{% endblock %}</title>
    <meta name="description" content="Personalized Diet and Nutrition Recommendation System">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    {% block head %}{% endblock %}
</head>
<body>

    <nav class="navbar glass">
        <a href="{% url 'home' %}" class="nav-brand">Diet & Nutrition System</a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dashboard' %}" class="btn btn-dashboard">Dashboard</a>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block scripts %}
    {% endblock %}
</body>
</html>
